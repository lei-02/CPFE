[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pfem-cpfe"
version = "0.1.0"
description = "Physics-informed Transolver warm starts for standalone crystal plasticity finite elements"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "torch>=2.4,<3",
  "einops>=0.8,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]
